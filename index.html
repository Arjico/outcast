<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>outcast</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 4vw, 2rem);
      background: #10131c;
      color: #f5f6fa;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(100%, 900px);
      text-align: center;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    p {
      margin: 0 0 2rem;
      color: #aeb5c5;
    }

    .video-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
      box-shadow: 0 20px 60px #0008;
    }

    .video-wrap iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>tuffstes video everrrr</h1>

    <div class="video-wrap">
      <iframe
        src="https://www.youtube.com/embed/N2MxncgtcC0"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>
  </main>
</body>
</html>
