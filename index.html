<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>outcast</title>
  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(1rem, 4vw, 2rem);
      background: #10131c;
      color: #f5f6fa;
      font-family: system-ui, sans-serif;
    }

    main {
      width: min(100%, 900px);
      text-align: center;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    h2 {
      margin: 2rem 0 0.75rem;
    }

    p {
      margin: 0 0 2rem;
      color: #aeb5c5;
    }

    .video-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 16px;
      background: #000;
      box-shadow: 0 20px 60px #0008;
    }

    .video-wrap iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }

    .downloads {
      width: min(100%, 420px);
      margin: 2rem auto 0;
      text-align: left;
    }

    .downloads summary {
      padding: 1rem 1.25rem;
      border: 1px solid #343a4b;
      border-radius: 12px;
      background: #1a1f2c;
      cursor: pointer;
      font-weight: 700;
    }

    .downloads summary:hover,
    .downloads summary:focus-visible {
      background: #242b3b;
    }

    .download-link {
      display: block;
      margin-top: 0.5rem;
      padding: 1rem 1.25rem;
      border-radius: 12px;
      background: #1a1f2c;
      color: #aebfff;
      text-decoration: none;
    }

    .download-link:hover,
    .download-link:focus-visible {
      background: #242b3b;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main>
    <h1>tuffstes video everrrr</h1>

    <div class="video-wrap">
      <iframe
        src="https://www.youtube.com/embed/N2MxncgtcC0"
        title="YouTube video player"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>

    <h2>tuffste BTS everrrr</h2>
    <div class="video-wrap">
      <iframe
        src="https://www.youtube.com/embed/NIanCl5y0Fs"
        title="BTS video"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>

    <details class="downloads">
      <summary>Downloads</summary>
      <a class="download-link" href="EWE.pdf" download>Download the EWE PDF</a>
    </details>
  </main>
</body>
</html>
